protocol:
  id: P1-LLM-OPINION-DYNAMICS
  version: UNRESOLVED[P1_PROTOCOL_VERSION]
status: draft
human_protocol_reference: docs/paper1-protocol.md

topic:
  id: UNRESOLVED[P1_TOPIC_PRIMARY]
  statement: UNRESOLVED[P1_TOPIC_PRIMARY]
  statement_sha256: UNRESOLVED[P1_TOPIC_PRIMARY]
stance:
  construct: UNRESOLVED[P1_TOPIC_PRIMARY]
  scale: UNRESOLVED[P1_STANCE_SCALE]
population:
  size: 1000
  source: UNRESOLVED[P1_POPULATION_SOURCE]
  fields: UNRESOLVED[P1_POPULATION_FIELDS]
  balance: UNRESOLVED[P1_POPULATION_BALANCE]
  exact_n: UNRESOLVED[P1_POPULATION_EXACT_N]
initialization:
  stance: UNRESOLVED[P1_INITIAL_STANCE_GENERATOR]
  reason: UNRESOLVED[P1_INITIAL_REASON_SOURCE]
  matched_across_cells: true
groups:
  cuts: UNRESOLVED[P1_INITIAL_GROUP_CUTS]
  min_size: UNRESOLVED[P1_MIN_GROUP_SIZE]

outcomes:
  primary:
    id: UNRESOLVED[P1_PRIMARY_OUTCOME]
    definition: UNRESOLVED[P1_PRIMARY_OUTCOME]
  group_structure:
    id: P1_CANDIDATE_DELTA_LOG_BW
    definition: delta_log_between_within
    t_star: UNRESOLVED[P1_ENDPOINT_TSTAR]
    epsilon: UNRESOLVED[P1_LOG_EPSILON]
  required_secondary: [public_stock, public_flow, expression_gap]
primary_estimand:
  id: P1_PRIMARY_WS_SHADOW_AVERAGE_EFFECT
  definition: equal_weight_identity_continuity_average_of_matched_seed_ws_minus_shadow

design:
  population_size: 1000
  rounds: 50
  matched_seeds_initial: 10
  matched_seeds_max: 20
  factor_levels:
    identity: [identity_absent, identity_present]
    continuity: [continuity_absent, continuity_present]
    exposure: [self_history_only, shuffled_social, ws_neighbors]
  cells:
    - {id: P1-I0-C0-E0, identity: identity_absent, continuity: continuity_absent, exposure: self_history_only}
    - {id: P1-I0-C0-E1, identity: identity_absent, continuity: continuity_absent, exposure: shuffled_social}
    - {id: P1-I0-C0-E2, identity: identity_absent, continuity: continuity_absent, exposure: ws_neighbors}
    - {id: P1-I0-C1-E0, identity: identity_absent, continuity: continuity_present, exposure: self_history_only}
    - {id: P1-I0-C1-E1, identity: identity_absent, continuity: continuity_present, exposure: shuffled_social}
    - {id: P1-I0-C1-E2, identity: identity_absent, continuity: continuity_present, exposure: ws_neighbors}
    - {id: P1-I1-C0-E0, identity: identity_present, continuity: continuity_absent, exposure: self_history_only}
    - {id: P1-I1-C0-E1, identity: identity_present, continuity: continuity_absent, exposure: shuffled_social}
    - {id: P1-I1-C0-E2, identity: identity_present, continuity: continuity_absent, exposure: ws_neighbors}
    - {id: P1-I1-C1-E0, identity: identity_present, continuity: continuity_present, exposure: self_history_only}
    - {id: P1-I1-C1-E1, identity: identity_present, continuity: continuity_present, exposure: shuffled_social}
    - {id: P1-I1-C1-E2, identity: identity_present, continuity: continuity_present, exposure: ws_neighbors}

persona:
  identity_absent_continuity_absent:
    template_id: UNRESOLVED[P1_PERSONA_TEMPLATES]
    template_sha256: UNRESOLVED[P1_PERSONA_TEMPLATES]
  identity_absent_continuity_present:
    template_id: UNRESOLVED[P1_PERSONA_TEMPLATES]
    template_sha256: UNRESOLVED[P1_PERSONA_TEMPLATES]
  identity_present_continuity_absent:
    template_id: UNRESOLVED[P1_PERSONA_TEMPLATES]
    template_sha256: UNRESOLVED[P1_PERSONA_TEMPLATES]
  identity_present_continuity_present:
    template_id: UNRESOLVED[P1_PERSONA_TEMPLATES]
    template_sha256: UNRESOLVED[P1_PERSONA_TEMPLATES]

network:
  type: watts_strogatz
  directed: UNRESOLVED[P1_GRAPH_DIRECTION]
  self_loops: false
  connectivity: UNRESOLVED[P1_GRAPH_CONNECTIVITY]
  on_invalid: UNRESOLVED[P1_INVALID_GRAPH_RULE]
  ws:
    k: UNRESOLVED[P1_WS_K]
    p: UNRESOLVED[P1_WS_P]
  shadow:
    fixed_for_run: true
    degree_matching: per_node_exact
    forbid_ws_edges: true
    connectivity: connected
    on_invalid: fail
dynamics:
  activation_mode: weighted_random_sequential_with_replacement
  activation_count: 1000
  sampling: with_replacement
  activity_weights:
    family: positive_truncated_lognormal
    normalization: sum_equals_population_size
    parameters: UNRESOLVED[P1_ACTIVITY_WEIGHT_DISTRIBUTION]
    calibration_targets: UNRESOLVED[P1_ACTIVITY_CALIBRATION_TARGETS]
state_model:
  private_state: updated_on_every_successful_activation
  public_post_stock: latest_successfully_published_post
  private_update_semantics: private_then_optional_public_post
  social_exposure_reads: public_posts_only
expression:
  publish_process:
    family: hurdle_beta
    flags: pregenerated_before_run
    parameters: UNRESOLVED[P1_PUBLISH_PROCESS]
  attention_expression_correlation:
    main: independent
    sensitivity: UNRESOLVED[P1_ATTENTION_EXPRESSION_CORRELATION]
event_model:
  identity: run_id_plus_event_ordinal
  read_state: previous_successful_commit
  commit_order: strict_serial
  failure_effect: no_state_cursor_or_rng_progress
  retry_identity: same_event_id_new_attempt_id
  sweep_role: observation_and_checkpoint_boundary_only
checkpoint:
  resume_cursor: next_event_ordinal
  failed_event: resume_same_event_identity
  verification: checkpoint_state_hash_and_event_chain
memory:
  window: UNRESOLVED[P1_MEMORY_WINDOW]
exposure:
  feed_message_capacity: UNRESOLVED[P1_MAX_NEIGHBORS]
  social_count: finite_unread_by_exposure_graph
  candidate_rule: public_posts_after_receiver_cursor
  overflow: keep_latest_and_expire_older
  underflow: no_backfill_allow_empty
  slot_order: frozen_seeded_permutation_after_selection
  first_activation: eligible_neighbor_round_zero_public_posts

model:
  provider: self_hosted
  model_id: Qwen/Qwen3-8B
  revision: UNRESOLVED[P1_MODEL_REVISION]
  precision: bf16
runtime:
  vllm:
    name: vllm
    version: UNRESOLVED[P1_VLLM_VERSION]
  timeout: UNRESOLVED[P1_TIMEOUT_RETRY]
  retry: UNRESOLVED[P1_TIMEOUT_RETRY]
  concurrency: UNRESOLVED[P1_CONCURRENCY_BUDGET]
  rate_budget: UNRESOLVED[P1_CONCURRENCY_BUDGET]
generation:
  temperature: UNRESOLVED[P1_TEMPERATURE]
  top_p: UNRESOLVED[P1_TOP_P]
  max_tokens: UNRESOLVED[P1_MAX_TOKENS]
  seed: UNRESOLVED[P1_REQUEST_SEED]
  seed_pairing: UNRESOLVED[P1_MODEL_SEED_PAIRING]
  thinking: false

metrics:
  variance_components: UNRESOLVED[P1_BW_FORMULA]
  ddof: UNRESOLVED[P1_BW_DDOF]
  missing_group: UNRESOLVED[P1_MISSING_GROUP_RULE]
sample_size:
  delta_min: UNRESOLVED[P1_DELTA_MIN]
shapes:
  thresholds: UNRESOLVED[P1_SHAPE_THRESHOLDS]
  window: UNRESOLVED[P1_SHAPE_WINDOW]
  sensitivity: UNRESOLVED[P1_SHAPE_SENSITIVITY]
analysis:
  primary_test: UNRESOLVED[P1_PRIMARY_INFERENCE]
  hierarchy:
    primary: [P1_PRIMARY_WS_SHADOW_AVERAGE_EFFECT]
    key_secondary: [P1_SECONDARY_CONTINUITY_WS_SHADOW_MODERATION]
    exploratory: [identity_moderation, identity_continuity_interaction, e0_mechanism_baseline]
  outcome_priority:
    primary: private_state
    required_secondary: [public_stock, public_flow, expression_gap]
  terminology:
    identity: population_identity_cue_visibility
    continuity: historical_stance_consistency_requirement
    private_state: nonpublic_agent_state
    public_post: agent_visible_discourse
  process_diagnostics:
    [message_count, message_age, source_coverage, repeated_source_share, empty_feed, sender_activity]
gates:
  continuity:
    scoring: UNRESOLVED[P1_CONTINUITY_MC_SCORING]
    lock_max: UNRESOLVED[P1_CONTINUITY_LOCK_THRESHOLD]
  quality:
    refusal_max: UNRESOLVED[P1_REFUSAL_THRESHOLD]
    parse_failure_max: UNRESOLVED[P1_PARSE_FAILURE_THRESHOLD]
  scale:
    design: UNRESOLVED[P1_SCALE_GATE_DESIGN]
    primary_outcome_tolerance: UNRESOLVED[P1_GATE_PRIMARY_OUTCOME_STABILITY]
    group_structure_delta_tolerance: UNRESOLVED[P1_GATE_DELTA_STABILITY]
    failure_max: UNRESOLVED[P1_GATE_FAILURE_MAX]
    throughput_min: UNRESOLVED[P1_GATE_THROUGHPUT_MIN]
    memory_max: UNRESOLVED[P1_GATE_MEMORY_MAX]
  formal:
    duration_max: UNRESOLVED[P1_GATE_DURATION_MAX]
    recovery_drills: UNRESOLVED[P1_RECOVERY_DRILLS]
    matrix_complete: UNRESOLVED[P1_MATRIX_COMPLETENESS]
quality:
  eligibility: UNRESOLVED[P1_ANALYSIS_ELIGIBILITY]
  exclusion: UNRESOLVED[P1_ANALYSIS_ELIGIBILITY]
stopping:
  on_gate_failure: stop_before_formal
sampling:
  formal_seeds: UNRESOLVED[P1_FORMAL_SEEDS]
  blind_ssr: UNRESOLVED[P1_FORMAL_SEEDS]
robustness:
  labels:
    model: [primary_self_hosted, api_snapshot_subset]
    prompt: [canonical, order_sensitivity]
    topic: [primary, reduced_topic_package]
    mechanism:
      [equal_activity, truncated_pareto_activity, positive_attention_expression_correlation,
       high_exposure_stock_snapshot]
  api:
    provider: UNRESOLVED[P1_API_PROVIDER]
    model_snapshot: UNRESOLVED[P1_API_SNAPSHOT]
    cells: UNRESOLVED[P1_API_ROBUSTNESS_CELLS]
    scale: UNRESOLVED[P1_API_ROBUSTNESS_SCALE_FREEZE]
storage:
  archive_uri: UNRESOLVED[P1_DATA_ARCHIVE_URI]
provenance:
  archive_map: UNRESOLVED[P1_ARCHIVE_PROVENANCE_MAP]
decision_provenance: {}
