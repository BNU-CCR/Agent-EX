[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ex"
version = "0.1.0"
description = "Reproducible simulation platform for Agent-EX Paper 1."
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.26.0",
    "networkx==3.6.1",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.20",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_ex.schemas" = ["*.json"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --basetemp=.pytest-tmp -m 'not release_scale'"
cache_dir = ".pytest-tmp/cache"
testpaths = ["tests"]
markers = [
    "release_integration: executes the complete N=100 twelve-cell mock matrix",
    "release_scale: executes the explicit N=1000/T=50 fifty-thousand-event mock gate",
]

[tool.ruff]
target-version = "py312"
line-length = 100
